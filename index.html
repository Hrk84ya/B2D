<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number System Converter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Number System Converter</h1>
        
        <form id="converterForm">
            <!-- Input Section -->
            <div class="field">
                <div class="field-header">
                    <label for="inputValue" id="inputLabel">Input Value</label>
                    <div class="select-container">
                        <select id="inputType" class="number-type-selector">
                            <option value="binary">Binary (Base-2)</option>
                            <option value="decimal" selected>Decimal (Base-10)</option>
                            <option value="hex">Hexadecimal (Base-16)</option>
                            <option value="octal">Octal (Base-8)</option>
                        </select>
                    </div>
                </div>
                <div class="input-container">
                    <input type="text" id="inputValue" placeholder="Enter number" required>
                    <button type="button" id="clearInput" class="icon-button" title="Clear input">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <span id="inputError" class="error-message"></span>
            </div>

            <!-- Swap Button -->
            <div class="swap-container">
                <button type="button" id="swapButton" class="icon-button" title="Swap input and output">
                    <i class="fas fa-exchange-alt"></i>
                </button>
            </div>

            <!-- Output Section -->
            <div class="field">
                <div class="field-header">
                    <label for="outputValue" id="outputLabel">Output Value</label>
                    <div class="select-container">
                        <select id="outputType" class="number-type-selector">
                            <option value="binary">Binary (Base-2)</option>
                            <option value="decimal">Decimal (Base-10)</option>
                            <option value="hex" selected>Hexadecimal (Base-16)</option>
                            <option value="octal">Octal (Base-8)</option>
                        </select>
                    </div>
                </div>
                <div class="input-container">
                    <input type="text" id="outputValue" disabled>
                    <button type="button" id="copyOutput" class="icon-button" title="Copy to clipboard">
                        <i class="far fa-copy"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="convertButton">Convert</button>
        </form>

        <!-- Step-by-Step Conversion -->
        <div class="conversion-steps" id="conversionSteps">
            <h3>Step-by-Step Conversion</h3>
            <div class="steps-container">
                <div class="step">
                    <div class="step-number">1</div>
                    <div class="step-content">
                        <h4>Input Value</h4>
                        <div class="bit-container" id="inputBits"></div>
                    </div>
                </div>
                <div class="step-arrow">↓</div>
                <div class="step">
                    <div class="step-number">2</div>
                    <div class="step-content">
                        <h4>Convert to Decimal</h4>
                        <div class="calculation" id="decimalCalculation"></div>
                    </div>
                </div>
                <div class="step-arrow">↓</div>
                <div class="step">
                    <div class="step-number">3</div>
                    <div class="step-content">
                        <h4>Convert to Target Base</h4>
                        <div class="calculation" id="targetCalculation"></div>
                    </div>
                </div>
                <div class="step-arrow">=</div>
                <div class="result-step">
                    <h4>Final Result</h4>
                    <div class="bit-container" id="outputBits"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
